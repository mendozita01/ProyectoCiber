<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova | Acceso Administrativo</title>
    
    <!-- Fuentes e Íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <canvas id="networkCanvas"></canvas>

    <header>
        <div class="logo">
            <img src="imagenes/logo.png" alt="TechNova Logo" class="header-logo">
            <h1>Tech<span class="highlight">Nova</span></h1>
            <span class="slogan">Conectividad Inteligente.</span>
        </div>
        <a href="index.html" class="btn-back">
            <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Volver al Portal
        </a>
    </header>

    <main class="hero">
        <div class="login-card">
            
            <!-- FORMULARIO DE LOGIN -->
            <div id="loginView">
                <div class="login-header">
                    <i data-lucide="shield-alert"></i>
                    <h2>Acceso Restringido</h2>
                    <p>Portal De Uso Exclusivo Para Personal Autorizado De TechNova</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario" required autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required>
                            <button type="button" id="togglePassword" class="toggle-password" tabindex="-1" title="Mostrar contraseña">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="btnSubmit">
                        <i data-lucide="log-in" style="width: 20px; height: 20px;"></i> Iniciar Sesión
                    </button>
                </form>

                <!-- Caja para mensajes de error -->
                <div class="error-box" id="errorBox">
                    <i data-lucide="alert-circle"></i>
                    <p id="errorMsg"></p>
                </div>
            </div>

            <!-- ANIMACIÓN DE LOGUEO EXITOSO -->
            <div id="successView">
                <div class="success-icon-wrapper" id="successIcon">
                    <i data-lucide="check"></i>
                </div>
                <h3 class="success-text">Acceso Concedido</h3>
                <p class="success-subtext">Iniciando Sesión Segura...</p>
            </div>

        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
